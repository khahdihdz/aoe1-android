name: Web launcher - Cloudflare Pages
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/cloudflare-pages.yml"]
  workflow_dispatch:
jobs:
  deploy:
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate web launcher
        run: |
          test -s web/index.html
          node --check web/app.js
      - uses: actions/deploy-pages@v4
        if: false
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web --project-name=aoe1-web --branch=${{ github.ref_name }}
