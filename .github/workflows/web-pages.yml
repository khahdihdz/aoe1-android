name: Web launcher - GitHub Pages
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web-pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Validate web launcher
        run: |
          test -s web/index.html
          test -s web/app.js
          test -s web/styles.css
          node --check web/app.js
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
